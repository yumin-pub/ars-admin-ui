name: Deploy Pages

# Storybook과 데모 앱을 한 사이트로 묶어 GitHub Pages에 배포한다.
# - Storybook: https://yumin-pub.github.io/ars-admin-ui/        (사이트 루트)
# - 데모 앱:   https://yumin-pub.github.io/ars-admin-ui/demo/   (Vite base /ars-admin-ui/demo/)
# - 404.html: 사이트 루트에 둔다. Pages는 없는 경로에 루트의 404.html만 쓰므로,
#   데모 경로의 직접 접근·새로고침은 404.html이 데모로 넘기고 데모 index.html이 원래 주소를 복원한다.
# storybook-static은 에셋을 상대 경로(./)로 불러 하위 경로 설정이 따로 필요 없다.
# tsc·lint·테스트·a11y 검사는 ci.yml이 맡고, 여기서는 빌드와 배포만 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 필요한 최소 권한만 준다.
# - contents: 저장소 읽기 (checkout)
# - pages: Pages 배포
# - id-token: deploy-pages가 OIDC 토큰으로 배포 요청을 인증
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 실행한다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 버전과 npm 캐시는 ci.yml과 같게 맞춘다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      # npm run build(tsc -b && vite build)에 인자를 붙이지 않고 vite build를 직접 불러 base가 vite에만 가게 한다.
      # (타입 검사는 ci.yml이 한다)
      - name: Build demo app
        run: npx vite build --base=/ars-admin-ui/demo/

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -R storybook-static/. _site/
          cp -R dist/. _site/demo/
          cp pages/404.html _site/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
